name: Bug report
description: Something is not working as expected
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: run-mode
    attributes:
      label: How do you run PromptDeck?
      options:
        - npm (dev)
        - npm (production build)
        - Docker Compose
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js version, browser.
      placeholder: Windows 11, Node 24, Chrome 140
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: shell
